[project]
name = "music-ai"
version = "0.1.0"
description = "Experiments in music AI: generation, optical music recognition, audio transcription"
readme = "README.md"
authors = [
    { name = "jpatrickb", email = "142933271+jpatrickb@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "converter21>=4.0.2",
    "music21>=10.5.2",
    "verovio>=6.4.1",
]

[project.scripts]
validate-notation = "music_ai.validate_notation:main"
harmony-check = "music_ai.harmony_check:main"
playability-check = "music_ai.playability_check:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
render = [
    "tinysoundfont>=0.3.7",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
