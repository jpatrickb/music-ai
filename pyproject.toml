[project]
name = "music-ai"
version = "0.1.0"
description = "AI for music experiments: LLM music generation and optical music recognition"
readme = "README.md"
authors = [
    { name = "jpatrickb", email = "142933271+jpatrickb@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "music21>=10.5.2",
    "verovio>=6.4.1",
    "wandb>=0.31.0",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
